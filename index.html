<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gift Sniper 🎯</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#0b0f1a;color:#e8ecf4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
#ld{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.spin{width:38px;height:38px;border-radius:50%;border:3px solid #1c2540;border-top-color:#f8b21a;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
b{color:#f8b21a}
</style>
</head>
<body>
<div id="ld"><div class="spin"></div><div><b>Gift Sniper</b> · загрузка…</div></div>
<script>
/* Тонкий bootstrap: уникальный URL на каждом открытии — кэш Telegram WebView не мешает */
(async () => {
  const fail = () => location.replace("app.html" + (location.hash || ""));
  try {
    const r = await fetch("version.json", { cache: "no-store" });
    const v = (await r.json()).v || "0";
    location.replace("app.html?v=" + encodeURIComponent(v) + "&t=" + Date.now() + (location.hash || ""));
  } catch (e) { fail(); }
  setTimeout(fail, 4000);
})();
</script>
</body>
</html>
